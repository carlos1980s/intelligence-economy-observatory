name: Validate research website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-research-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: node --test tests/site.test.mjs
      - run: python -m unittest discover -s tests -p test_site.py -v
      - run: python tools/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-static-site
          path: dist
          retention-days: 7
